edition = "2023";

package gophkeeper.api.v1;

import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/empty.proto";
import "validate/validate.proto";

option go_package = "github.com/oleshko-g/gophkeeper/api/v1;pb";

// DepositorService is the interface to:
//  - [Register] public keys of the Keeper users
//  - [Authorize] their client apps
service DepositorService {
  // Register registers an anonymous public key and returns encrypted id of the registered pub key and the public key of [KeeperService].
  // The owner of the id can then [Authorize] apps to make requests to [KeeperService]
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Authorize authorizes an app of the registered public key owner's to [KeeperService] and returns an authentication token.
  // The owner of the authentication token can then make requests to [KeeperService]
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}

// KeeperService is the interface to:
//  - [UploadData] of the owners of the [Register]ed public keys
//  - [DownloadData] the uploaded data
//  - [ListData] the uploaded data
//  - [DeleteData] the uploaded data
service KeeperService {
  // UploadData uploads data of the owners of the [Register]ed public keys.
  rpc DepositSecret(DepositSecretRequest) returns (DepositSecretResponse);

  // DownloadData downloads the [Upload]ed data
  rpc DownloadData(DownloadDataRequest) returns (DownloadDataResponse);

  // DownloadData lists the [Upload]ed data
  rpc ListData(ListDataRequest) returns (ListDataResponse);

  // Delete deletes the [Upload]ed data from the [KeeperService]
  rpc DeleteData(DeleteDataRequest) returns (DeleteDataResponse);

  // DownloadFile downloads a file from the [KeeperService]
  rpc DownloadFile(DownloadFileRequest) returns (stream google.api.HttpBody) {
    option (google.api.http) = {get: "/v1/file/download"};
  }

  // UploadFile uploads a file to the [KeeperService]
  rpc UploadFile(stream google.api.HttpBody) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/file/upload"
      body: "*"
    };
  }
}

message RegisterRequest {
  string pub_key = 1 [(validate.rules).string.min_len = 1];
}

message RegisterResponse {
  string encrypted_id = 1;
}

message AuthorizeRequest {
  string decrypted_id = 1 [(validate.rules).string.min_len = 1];
}

message AuthorizeResponse {
  string auth_token = 1;
}

message DepositSecretRequest {
  bytes payload = 1;
}

message DepositSecretResponse {
  UUID deposited_secret_id = 1;
}

message DownloadDataRequest {}

message DownloadDataResponse {}

message DeleteDataRequest {}

message DeleteDataResponse {}

message ListDataRequest {}

message ListDataResponse {}

message DownloadFileRequest {}

message UUID {
  bytes bytes = 1;
}
